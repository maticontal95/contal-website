<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.png" type="image/png">
  <meta name="format-detection" content="telephone=no">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M. Contal Construction Renovation | General Contractor in Montreal</title>
  <meta name="description"
      content="M. Contal is a Montreal-based general contracting practice specializing in residential construction and renovation.">
  <link rel="canonical" href="https://contal.work/">  
  <link rel="stylesheet" href="style.css">
  <meta property="og:title" content="M. Contal">
  <meta property="og:description" content="Residential construction and renovation in Montreal.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://contal.work/">
  <meta property="og:image" content="https://contal.work/assets/montreal-duplex-renovation.jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"GeneralContractor",
      "name":"M. Contal",
      "url":"https://contal.work",
      "email":"mailto:mati@contal.work",
      "telephone":"+1-613-220-0362",
      "areaServed":{
        "@type":"City",
        "name":"Montreal"
      },
      "address":{
        "@type":"PostalAddress",
        "addressLocality":"Montreal",
        "addressRegion":"QC",
        "addressCountry":"CA"
      }
    }
    </script>
</head>
<body>
  <div class="page">
    <header class="top-row">
      <div class="brand">
        <p>M. Contal</p>
      </div>

      <div class="services">
        <p>
          Construction<br>
          R<span class="i18n" data-en="e" data-fr="é"></span>novation
        </p>
      </div>
    </header>

    <main class="content-row">
      <nav class="pseudo-menu" aria-label="Section navigation">
        <button class="menu-link is-active" data-panel="home" type="button">
            <span class="i18n" data-en="On site" data-fr="En chantier"></span>
        </button>
        <button class="menu-link" data-panel="services" type="button">
          <span class="i18n"
                data-en="Services"
                data-fr="Services">
          </span>
      </button>
        <button class="menu-link" data-panel="about" type="button">
            <span class="i18n" data-en="About" data-fr="À propos">About</span>
        </button>
      </nav>

      <div class="stage-slot">
        <div class="stage">
          <div class="stage-panel stage-home is-active" data-stage="home">
            <div class="site-gallery">
              <button class="gallery-item" type="button" aria-label="Open photograph 1"><img src="assets/montreal-duplex-renovation.jpeg" alt="" loading="lazy"></button>
              <button class="gallery-item" type="button" aria-label="Open photograph 2"><img src="assets/montreal-duplex-addition.jpeg" alt="" loading="lazy"></button>
              <button class="gallery-item" type="button" aria-label="Open photograph 3"><img src="assets/custom-structural-masonry-montreal.jpeg" alt="" loading="lazy"></button>
              <button class="gallery-item" type="button" aria-label="Open photograph 4"><img src="assets/traditional-building-crafts-montreal.jpeg" alt="" loading="lazy"></button>
              <button class="gallery-item" type="button" aria-label="Open photograph 5"><img src="assets/custom-millwork-montreal.jpeg" alt="" loading="lazy"></button>
              <button class="gallery-item" type="button" aria-label="Open photograph 6"><img src="assets/custom-residential-millwork-montreal.jpeg" alt="" loading="lazy"></button>
            </div>
          </div>
          <div class="stage-panel stage-services" data-stage="services">
            <div class="about-box">
                <div class="about-content i18n-html" id="services-content"></div>
            </div>
        </div>
          <div class="stage-panel stage-about" data-stage="about">
            <div class="about-box">
              <div class="about-content i18n-html" id="about-content"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="menu-spacer" aria-hidden="true"></div>
    </main>

    <footer class="bottom-row">
      <div class="contact">
        <p>
          RBQ: 5879-9339-01<br>
          <a href="mailto:mati@contal.work" class="email-link">mati@contal.work</a><br>
          (613) 220 0362
        </p>
      </div>

      <div class="lang">
        <button id="lang-toggle" type="button" aria-label="Switch language">FR</button>
      </div>
    </footer>
  </div>

  <dialog class="lightbox" aria-label="Photograph">
    <button class="lightbox-close" type="button" aria-label="Close">×</button>
    <button class="lightbox-prev" type="button" aria-label="Previous photograph">←</button>
    <figure><img alt=""><figcaption></figcaption></figure>
    <button class="lightbox-next" type="button" aria-label="Next photograph">→</button>
  </dialog>
  <script src="script.js"></script>
</body>
</html>
